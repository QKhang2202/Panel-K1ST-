<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>WormGPT - Chọn vai trò</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;font-family:Arial,sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:12px}
.container{background:rgba(18,18,28,.95);border-radius:24px;padding:40px 30px;max-width:400px;width:100%;border:1px solid rgba(0,255,200,.1);text-align:center}
h1{color:#ff0066;font-size:28px;margin-bottom:6px}
.sub{color:#888;font-size:14px;margin-bottom:30px}
.btn-role{display:block;width:100%;padding:18px;border:2px solid #2a2a3a;border-radius:14px;background:0;color:#fff;font-size:18px;font-weight:700;cursor:pointer;transition:.3s;margin:10px 0;text-decoration:none}
.btn-role:hover{transform:scale(1.02)}
.btn-role.admin{border-color:#ff0066}
.btn-role.admin:hover{background:#ff0066;color:#fff;box-shadow:0 0 40px rgba(255,0,102,.3)}
.btn-role.user{border-color:#00ffcc}
.btn-role.user:hover{background:#00ffcc;color:#0a0a0a;box-shadow:0 0 40px rgba(0,255,204,.3)}
.footer{color:#333;font-size:12px;margin-top:20px}
</style>
</head>
<body>
<div class="container">
<h1>👿 WormGPT</h1>
<div class="sub">Chọn vai trò của bạn</div>
<a href="admin.html" class="btn-role admin">🔐 ADMIN</a>
<a href="user.html" class="btn-role user">🎮 NGƯỜI CHƠI</a>
<div class="footer">Panel Quản Lý Key Pro</div>
</div>
</body>
</html>
